name: Auto Comment on PR

on:
  # pull_request:
  #   types: [*]  # Triggers on all pull request events
  pull_request:
    types: [opened]

  workflow_dispatch:

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      # - name: trigger pr
